<a class="skip" href="#contenido">Saltar al contenido</a>

<div class="shell">
  <header class="sidebar">
    <div class="brand">
      <img class="mark" src="servit-mark.svg" width="26" height="26" alt="" aria-hidden="true" />
      <p class="brand-name" translate="no">SERVIT</p>
    </div>

    <nav aria-label="Módulos">
      <ul>
        @for (link of links; track link.key) {
          <li>
            <a
              [routerLink]="link.path"
              [fragment]="link.fragment"
              [attr.aria-current]="current() === link.key ? 'page' : null"
            >
              <ng-icon [name]="link.icon" class="icon" aria-hidden="true" />
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    @if (account(); as person) {
      <div class="account">
        <p class="account-person">
          <span class="account-initial" aria-hidden="true">{{ person.initial }}</span>
          <span class="account-label">{{ person.label }}</span>
        </p>
        <button type="button" class="sign-out" (click)="askSignOut()">Cerrar sesión</button>
        <dialog
          #signOutDialog
          class="sign-out-dialog"
          closedby="any"
          aria-labelledby="sign-out-title"
          (close)="resetSignOut($event)"
          (pointerdown)="trackBackdrop($event)"
          (pointerup)="trackBackdrop($event)"
        >
          <h2 id="sign-out-title">Cerrar sesión</h2>
          <p>Cierras tu cuenta en SERVIT.</p>
          <form method="dialog">
            <button value="cancel" autofocus [disabled]="leaving()">Cancelar</button>
            <button type="button" class="dialog-confirm" (click)="confirmSignOut()" [disabled]="leaving()">
              {{ leaving() ? 'Cerrando…' : 'Cerrar sesión' }}
            </button>
          </form>
        </dialog>
      </div>
    }
  </header>

  <main class="content">
    <ng-content />
  </main>
</div>
